<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Task Manager</h1>

    <ol class="menu">
      <li>Add task</li>
      <li>View tasks</li>
      <li>Delete task</li>
      <li>Exit</li>
    </ol>

    <!-- Step 1: enter a condition number -->
    <form id="condition-form" autocomplete="off">
      <label for="condition">Enter a condition number:</label>
      <div class="row">
        <input id="condition" type="number" min="1" max="4" placeholder="1 - 4" required />
        <button type="submit">Go</button>
      </div>
    </form>

    <!-- Step 2: shown depending on the condition -->
    <form id="task-form" class="step hidden" autocomplete="off">
      <label for="task-input">Enter a task:</label>
      <div class="row">
        <input id="task-input" type="text" maxlength="200" />
        <button type="submit">Add</button>
      </div>
    </form>

    <form id="delete-form" class="step hidden" autocomplete="off">
      <label for="index-input">Enter the index of task:</label>
      <div class="row">
        <input id="index-input" type="number" min="0" />
        <button type="submit" class="danger">Delete</button>
      </div>
    </form>

    <p id="message" class="message" role="status"></p>

    <section id="tasks-section" class="hidden">
      <h2>Tasks</h2>
      <ul id="task-list"></ul>
      <p id="empty" class="empty">No tasks yet.</p>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
